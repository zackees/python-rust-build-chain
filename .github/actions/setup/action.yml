name: "Setup Build Environment"
description: "Install Rust toolchain, Python via uv, and configure caching with zccache"

inputs:
  rust-target:
    description: "Rust target triple (e.g., x86_64-unknown-linux-gnu)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Read rust-toolchain.toml
      id: toolchain
      shell: bash
      run: |
        CHANNEL=$(grep 'channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')
        echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup toolchain install ${{ steps.toolchain.outputs.channel }} \
          --profile minimal -c clippy -c rustfmt --no-self-update
        rustup target add ${{ inputs.rust-target }} --toolchain ${{ steps.toolchain.outputs.channel }}
      env:
        RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}

    # Layer 1: zccache (compiler output cache — replaces sccache)
    # ~1ms per warm hit vs ~170ms for sccache
    - name: Restore zccache
      uses: actions/cache/restore@v4
      with:
        path: ~/.zccache
        key: zccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-target }}-${{ github.sha }}
        restore-keys: |
          zccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-target }}-
          zccache-${{ runner.os }}-${{ runner.arch }}-

    - name: Install and start zccache
      shell: bash
      run: |
        pip install zccache
        zccache start

    # Layer 2: Swatinem/rust-cache (registry + index only, NO target caching)
    # Kept until zccache gains cargo registry caching (see zackees/zccache#10)
    - name: Setup Rust cache (registry only)
      uses: Swatinem/rust-cache@v2
      with:
        cache-targets: false
        shared-key: ${{ inputs.rust-target }}

    # Layer 3: uv cache (Python packages)
    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install Python dependencies
      shell: bash
      run: uv sync --no-install-project

    - name: Set build environment
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=zccache" >> "$GITHUB_ENV"
        echo "CARGO_BUILD_TARGET=${{ inputs.rust-target }}" >> "$GITHUB_ENV"
        echo "RUSTUP_TOOLCHAIN=${{ steps.toolchain.outputs.channel }}" >> "$GITHUB_ENV"
