name: Build and Test

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      maturin-args:
        required: false
        type: string
        default: ""
      save-cache:
        required: false
        type: string
        default: "true"

jobs:
  build:
    name: "Build (${{ inputs.target }})"
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup
        with:
          rust-target: ${{ inputs.target }}
          save-cache: ${{ inputs.save-cache }}

      - name: Build wheel
        shell: bash
        run: |
          uv run --no-sync maturin build \
            --release \
            --target ${{ inputs.target }} \
            ${{ inputs.maturin-args }}

      # Windows ARM workaround: PyO3 generate-import-lib creates python3.lib
      # but the linker expects python310.lib
      - name: Retry with PyO3 import lib fix (Windows ARM only)
        if: failure() && inputs.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          find target -name "python3.lib" -exec sh -c \
            'dir=$(dirname "$1"); [ ! -f "$dir/python310.lib" ] && cp "$1" "$dir/python310.lib"' _ {} \;
          uv run --no-sync maturin build \
            --release \
            --target ${{ inputs.target }} \
            ${{ inputs.maturin-args }}

      - name: Audit wheel (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv pip install auditwheel
          for whl in target/wheels/*.whl; do
            uv run --no-sync auditwheel show "$whl"
          done

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ inputs.target }}
          path: target/wheels/*.whl

      - name: Cleanup zccache
        if: always()
        uses: zackees/zccache/action/cleanup@1.14.14

  lint:
    name: "Lint (${{ inputs.target }})"
    runs-on: ${{ inputs.runner }}
    # Only lint on native targets (skip cross-compiled targets)
    if: >-
      inputs.target != 'aarch64-pc-windows-msvc' &&
      inputs.target != 'x86_64-apple-darwin'
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup
        with:
          rust-target: ${{ inputs.target }}
          save-cache: ${{ inputs.save-cache }}

      - name: Rust fmt
        shell: bash
        run: cargo fmt --all -- --check

      - name: Rust clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Python ruff
        shell: bash
        run: |
          uv run --no-sync ruff check src/ tests/ ci/
          uv run --no-sync ruff format --check src/ tests/ ci/

      - name: Cleanup zccache
        if: always()
        uses: zackees/zccache/action/cleanup@1.14.14

  test:
    name: "Test (${{ inputs.target }})"
    runs-on: ${{ inputs.runner }}
    # Only test on native targets
    if: >-
      inputs.target != 'aarch64-pc-windows-msvc' &&
      inputs.target != 'x86_64-apple-darwin'
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup
        with:
          rust-target: ${{ inputs.target }}
          save-cache: ${{ inputs.save-cache }}

      - name: Rust tests
        shell: bash
        run: cargo test --workspace

      - name: Build and install for Python tests
        shell: bash
        run: uv run --no-sync maturin develop --release

      - name: Python tests
        shell: bash
        run: uv run --no-sync pytest tests/ -v

      - name: Cleanup zccache
        if: always()
        uses: zackees/zccache/action/cleanup@1.14.14
