name: Build and Test

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      build-runner:
        # Runner for the wheel build only; defaults to `runner`. Linux targets
        # build on the opposite-arch runner so `soldr wheel` does a cross build,
        # the only build it can tag manylinux_2_17 (soldr docs/API.md).
        required: false
        type: string
        default: ""
      save-cache:
        required: false
        type: string
        default: "true"

jobs:
  build:
    name: "Build (${{ inputs.target }})"
    runs-on: ${{ inputs.build-runner || inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup
        with:
          rust-target: ${{ inputs.target }}
          save-cache: ${{ inputs.save-cache }}

      # soldr wheel, not the maturin CLI or zig (zackees/ci.yml#17). uvx runs
      # soldr in its own env (no project sync); keep the floor in step with
      # pyproject's build-system requirement.
      - name: Build wheel
        shell: bash
        run: uvx --from 'soldr>=0.9.25' soldr wheel --release --target ${{ inputs.target }}

      - name: Audit wheel (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv pip install auditwheel
          for whl in target/wheels/*.whl; do
            uv run --no-sync auditwheel show "$whl"
          done

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ inputs.target }}
          path: target/wheels/*.whl

      - name: Cleanup zccache
        if: always()
        uses: zackees/zccache/action/cleanup@1.14.14

  lint:
    name: "Lint (${{ inputs.target }})"
    runs-on: ${{ inputs.runner }}
    # Only lint on native targets (skip cross-compiled targets)
    if: >-
      inputs.target != 'aarch64-pc-windows-msvc' &&
      inputs.target != 'x86_64-apple-darwin'
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup
        with:
          rust-target: ${{ inputs.target }}
          save-cache: ${{ inputs.save-cache }}

      - name: Rust fmt
        shell: bash
        run: cargo fmt --all -- --check

      - name: Rust clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Python ruff
        shell: bash
        run: |
          uv run --no-sync ruff check src/ tests/ ci/
          uv run --no-sync ruff format --check src/ tests/ ci/

      - name: Cleanup zccache
        if: always()
        uses: zackees/zccache/action/cleanup@1.14.14

  test:
    name: "Test (${{ inputs.target }})"
    needs: build
    runs-on: ${{ inputs.runner }}
    # Only test on native targets
    if: >-
      inputs.target != 'aarch64-pc-windows-msvc' &&
      inputs.target != 'x86_64-apple-darwin'
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup
        with:
          rust-target: ${{ inputs.target }}
          save-cache: ${{ inputs.save-cache }}

      - name: Rust tests
        shell: bash
        run: cargo test --workspace

      # Test the wheel the build job produced, not a local rebuild.
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-${{ inputs.target }}
          path: dist/

      - name: Install wheel
        shell: bash
        run: uv pip install dist/*.whl

      - name: Python tests
        shell: bash
        run: uv run --no-sync pytest tests/ -v

      - name: Cleanup zccache
        if: always()
        uses: zackees/zccache/action/cleanup@1.14.14
