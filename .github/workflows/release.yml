name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          # soldr wheel enforces (and tags) manylinux_2_17 only on a cross
          # build. aarch64 cross-builds from x86_64; x86_64 cannot cross from
          # arm64 (soldr#2874), so it builds natively and is tagged from the
          # bytes until soldr#3432 lands.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-2025
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup
        with:
          rust-target: ${{ matrix.target }}

      # soldr wheel, not the maturin CLI or zig (zackees/ci.yml#17).
      - name: Build wheel
        shell: bash
        run: uvx --from 'soldr>=0.9.25' soldr wheel --release --target ${{ matrix.target }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: target/wheels/*.whl

      - name: Cleanup zccache
        if: always()
        uses: zackees/zccache/action/cleanup@1.14.14

  build-sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --sdist --out-dir target/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  publish:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
